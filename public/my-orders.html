<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Theo dõi và quản lý đơn hàng Foodie.">

    <title>Đơn hàng của tôi - Foodie</title>

    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/my-orders.css">
</head>

<body data-page="my-orders">

    <header id="site-header"></header>

    <main>
        <section class="orders-banner">
            <div class="container">
                <span class="orders-banner-label">
                    🍔 FOODIE
                </span>

                <h1>Đơn hàng của tôi</h1>

                <p>
                    Theo dõi trạng thái và xem lại những món ăn
                    bạn đã đặt tại Foodie.
                </p>
            </div>
        </section>

        <section class="section orders-section">
            <div class="container">

                <div class="orders-heading">
                    <div>
                        <h2>Lịch sử đặt hàng</h2>
                        <p>Danh sách những đơn hàng của bạn.</p>
                    </div>

                    <a href="/index.html" class="btn btn-primary">
                        + Đặt món mới
                    </a>
                </div>

                <div id="orders-message" class="orders-message">
                    Đang tải danh sách đơn hàng...
                </div>

                <div id="orders-list" class="orders-list"></div>

                <div id="order-detail" class="order-detail hidden">
                    <div class="order-detail-header">
                        <div>
                            <h2>Chi tiết đơn hàng</h2>
                            <p id="detail-order-code"></p>
                        </div>

                        <button id="close-detail" class="close-detail-btn">
                            ✕
                        </button>
                    </div>

                    <div id="order-detail-content"></div>
                </div>

            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="/js/common.js"></script>
    <script src="/js/my-orders.js"></script>

</body>
</html>
