
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thực đơn Foodie - Khám phá các món ăn hấp dẫn.">
    <title>Thực đơn - Foodie</title>

    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/products.css">
</head>

<body data-page="products">

    <header id="site-header"></header>

    <main>
        <section class="menu-banner">
            <div class="container">
                <h1>Thực đơn <span class="text-primary">Foodie</span></h1>
                <p>Khám phá những món ăn hấp dẫn dành cho bạn.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">

                <div class="menu-toolbar">
                    <input
                        type="search"
                        id="search-input"
                        placeholder="Tìm món ăn..."
                    >

                    <input
                        type="number"
                        id="min-price"
                        placeholder="Giá từ"
                        min="0"
                    >

                    <input
                        type="number"
                        id="max-price"
                        placeholder="Giá đến"
                        min="0"
                    >

                    <button class="btn btn-primary" id="filter-button">
                        Tìm kiếm
                    </button>
                </div>

                <div id="result-count" class="result-count"></div>

                <div id="product-list" class="product-grid">
                    <div class="empty-state">Đang tải thực đơn...</div>
                </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="/js/common.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
