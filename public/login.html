
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đăng nhập tài khoản Foodie.">
    <title>Đăng nhập - Foodie</title>

    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-main">
        <div class="auth-layout">

            <section class="auth-visual">
                <div class="auth-food">🍔</div>

                <h2>Chào mừng trở lại!</h2>

                <p>
                    Đăng nhập để tiếp tục khám phá những món ăn
                    hấp dẫn tại Foodie.
                </p>
            </section>

            <section class="auth-content">

                <a href="/" class="auth-brand">
                    🍔 Foodie.
                </a>

                <h1>Đăng nhập</h1>

                <p class="auth-subtitle">
                    Chào mừng bạn quay trở lại với Foodie.
                </p>

                <div
                    id="auth-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite">
                </div>

                <form id="login-form" class="auth-form">

                    <div class="auth-field">
                        <label for="email">Địa chỉ Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Mật khẩu</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="password">
                                Hiện
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">
                        Đăng nhập
                    </button>

                </form>

                <p class="auth-switch">
                    Bạn chưa có tài khoản?
                    <a href="/register">Đăng ký ngay</a>
                </p>

                <a href="/" class="auth-back">
                    ← Quay lại trang chủ
                </a>

            </section>
        </div>
    </main>

    <footer class="auth-footer">
        © <span id="current-year"></span> Foodie. All rights reserved.
    </footer>

    <script src="/js/auth.js"></script>

    <script>
        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
