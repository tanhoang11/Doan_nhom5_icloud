
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tạo tài khoản Foodie miễn phí.">
    <title>Đăng ký - Foodie</title>

    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-main">
        <div class="auth-layout">

            <section class="auth-visual">
                <div class="auth-food">🍕</div>

                <h2>Tham gia Foodie!</h2>

                <p>
                    Tạo tài khoản để trải nghiệm và khám phá
                    thế giới ẩm thực cùng chúng tôi.
                </p>
            </section>

            <section class="auth-content">

                <a href="/" class="auth-brand">
                    🍔 Foodie.
                </a>

                <h1>Tạo tài khoản</h1>

                <p class="auth-subtitle">
                    Đăng ký nhanh chóng để bắt đầu trải nghiệm.
                </p>

                <div
                    id="auth-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite">
                </div>

                <form id="register-form" class="auth-form">

                    <div class="auth-field">
                        <label for="email">Địa chỉ Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="auth-field">
                        <label for="password">Mật khẩu</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Ít nhất 6 ký tự"
                                autocomplete="new-password"
                                minlength="6"
                                required>

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="password">
                                Hiện
                            </button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="confirm-password">
                            Xác nhận mật khẩu
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirm-password"
                                name="confirmPassword"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="confirm-password">
                                Hiện
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">
                        Tạo tài khoản
                    </button>

                </form>

                <p class="auth-switch">
                    Bạn đã có tài khoản?
                    <a href="/login">Đăng nhập</a>
                </p>

                <a href="/" class="auth-back">
                    ← Quay lại trang chủ
                </a>

            </section>
        </div>
    </main>

    <footer class="auth-footer">
        © <span id="current-year"></span> Foodie. All rights reserved.
    </footer>

    <script src="/js/auth.js"></script>

    <script>
        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
